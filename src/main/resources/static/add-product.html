<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesSavvy | Add Product</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="admin-brand">S<span>alesSavvy</span></div>
        <nav class="admin-menu">
            <a href="/admin-home.html">Dashboard</a>
            <a href="/all-products-admin.html">Products</a>
            <a href="/add-product.html">Add Product</a>
            <button type="button" onclick="logout()">Logout</button>
        </nav>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <div>
                <div class="section-label">PRODUCT MANAGEMENT</div>
                <h1>Add Product</h1>
            </div>
            <a href="/admin-home.html" class="btn btn-secondary">← Back</a>
        </div>

        <div class="product-form">
            <form id="addProductForm">
                <div class="product-form-grid">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" placeholder="Enter product name" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="Enter category" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price</label>
                        <input type="number" id="price" min="0" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Describe the product" required></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="imageUrl">Product Image URL</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/product.jpg">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Product</button>
                    <a href="/admin-home.html" class="btn btn-secondary">Cancel</a>
                </div>
                <p id="message" class="form-message"></p>
            </form>
        </div>
    </main>
</div>
<script src="/js/admin-products.js"></script>
</body>
</html>
