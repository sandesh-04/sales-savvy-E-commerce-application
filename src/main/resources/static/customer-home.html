<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesSavvy | Shop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="customer-header">
    <div class="customer-header-inner">
        <a href="/customer-home.html" class="logo">S<span>alesSavvy</span></a>
        <div class="customer-actions">
            <span id="welcomeText" style="font-size:13px;color:var(--muted);"></span>
            <button class="btn btn-secondary" onclick="goToCart()">Cart</button>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<main class="section">
    <div class="container">
        <div class="section-header">
            <div>
                <div class="section-label">SALESAVVY STORE</div>
                <h2>Discover products</h2>
                <p>Browse the catalog and add products to your cart.</p>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="search" id="productSearch" placeholder="Search products by name or category...">
            </div>
            <button class="btn btn-primary" onclick="loadProducts()">Refresh</button>
        </div>

        <div id="shoppingSection">
            <div id="productList" class="product-grid">
                <div class="loading">Loading products...</div>
            </div>
        </div>
    </div>
</main>

<script src="/js/customer.js"></script>
</body>
</html>
