<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesSavvy | Customer Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">S<span>alesSavvy</span></div>
        <h2>Welcome back</h2>
        <p class="form-subtitle">Sign in to continue shopping.</p>
        <form id="loginForm">
            
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" placeholder="Enter your username" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
    
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>
        <p id="message" class="form-message"></p>
        <div class="auth-footer">New to SalesSavvy? <a href="/signup.html">Create an account</a></div>
    </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
