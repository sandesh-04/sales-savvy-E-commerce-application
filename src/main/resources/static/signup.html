<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesSavvy | Create Account</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">S<span>alesSavvy</span></div>
        <h2>Create your account</h2>
        <p class="form-subtitle">Join SalesSavvy and start shopping.</p>
        <form id="signupForm">
            
        <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" placeholder="Enter your name" required></div>
        <div class="form-group"><label for="username">Username</label><input type="text" id="username" placeholder="Choose a username" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Create a password" required></div>
    
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
        <p id="message" class="form-message"></p>
        <div class="auth-footer">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
